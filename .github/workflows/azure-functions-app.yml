name: Azure Functions App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'MealWiz/src/MealWiz.Functions/**'
      - '.github/workflows/azure-functions-app.yml'
  pull_request:
    paths:
      - 'MealWiz/src/MealWiz.Functions/**'
      - 'MealWiz/tests/MealWiz.Functions.Tests/**'
      # The integration tests run against the local stack's migrations and seed.
      - 'supabase/**'
      - 'global.json'
      - '.github/workflows/azure-functions-app.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: MealWizFunctions
  AZURE_FUNCTIONAPP_PACKAGE_PATH: ./output
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Functions tests
    env:
      # Makes LocalSupabaseFixture fail instead of skip, so a broken stack can't hide the integration tests.
      REQUIRE_SUPABASE: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Full stack rather than `supabase db start`: the tests need the REST and Auth APIs plus seed.sql's user.
      - name: Start Supabase local development setup
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,storage-api,logflare,vector,postgres-meta,supavisor

      - name: Export Supabase credentials
        run: |
          status="$(supabase status -o env)"
          url="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' <<< "$status")"
          key="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' <<< "$status")"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::supabase status didn't report API_URL and SERVICE_ROLE_KEY."
            exit 1
          fi
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Run tests
        run: dotnet test --project MealWiz/tests/MealWiz.Functions.Tests

  build_and_deploy:
    needs: test
    # Deploys only from main. The Azure federated credential trusts refs/heads/main and nothing else, so don't
    # add an `environment:` here: it changes the OIDC subject and the login would be rejected.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish MealWiz/src/MealWiz.Functions -c Release -o ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Managed identity provisioned by the portal, scoped to Website Contributor on this Function App only.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1F185598B5A94E529C285CEB2B9BCE15 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_336479C95381413E8418BFB867EA1255 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F8EA5A41E1C6403E91728DF4A86A6838 }}

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
