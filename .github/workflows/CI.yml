name: CI

on:
  pull_request:
    # The Function App's tests run in azure-functions-app.yml.
    paths-ignore:
      - 'MealWiz/src/MealWiz.Functions/**'
      - 'MealWiz/tests/MealWiz.Functions.Tests/**'
      - '.github/workflows/azure-functions-app.yml'
  workflow_dispatch:

jobs:
  DB_CI_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # Linux picks outgoing ports from 32768-60999, which covers Supabase's 543xx ports, so a random
      # connection can grab one just before Supabase binds it. Moving the range out of the way prevents that.
      - name: Keep outgoing connections off Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"

      # A fresh database applies every migration and seed.sql from scratch, so a broken migration fails here
      # rather than in production.
      - name: Apply migrations and seed to a fresh database
        run: supabase db start

  WASM_CI_Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # 9 for the app, 10 for MealWiz.Shared.Tests.
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build MealWiz/MauiWASM/MauiWASM.csproj
      - name: Run MealWiz.Shared tests
        run: dotnet test --project MealWiz/tests/MealWiz.Shared.Tests
