name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    # The Function App deploys from azure-functions-app.yml.
    paths-ignore:
      - 'MealWiz/src/MealWiz.Functions/**'
      - 'MealWiz/tests/MealWiz.Functions.Tests/**'
      - '.github/workflows/azure-functions-app.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    outputs:
      previous_sha: ${{ steps.get_previous_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true
          lfs: false

      - name: Get previous commit SHA
        id: get_previous_sha
        run: echo "sha=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # The function key isn't a true secret (it ships in the public bundle), but it's kept out of git.
      - name: Inject MealImportFunction key
        env:
          MEAL_IMPORT_FUNCTION_KEY: ${{ secrets.MEAL_IMPORT_FUNCTION_KEY }}
        run: |
          if [ -z "$MEAL_IMPORT_FUNCTION_KEY" ]; then
            echo "::error::The MEAL_IMPORT_FUNCTION_KEY secret is not set; meal imports would fail with 401."
            exit 1
          fi
          settings=MealWiz/MauiWASM/wwwroot/appsettings.Production.json
          jq --arg key "$MEAL_IMPORT_FUNCTION_KEY" '.MealImportFunction.key = $key' "$settings" > "$settings.tmp"
          mv "$settings.tmp" "$settings"

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_HILL_0F87A3A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/MealWiz/MauiWASM"
          api_location: ""
          output_location: "wwwroot"

  apply_migrations:
    needs: build_and_deploy
    runs-on: ubuntu-latest
    name: Apply db migrations
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Pinned (matches local) so a new CLI release can't change how production migrations are pushed.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push

  rollback_deployment:
    needs: [build_and_deploy, apply_migrations]
    if: needs.build_and_deploy.result == 'success' && needs.apply_migrations.result == 'failure'
    runs-on: ubuntu-latest
    name: Rollback deployment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build_and_deploy.outputs.previous_sha }}
          fetch-depth: 1
          submodules: true
          lfs: false

      - name: Inject MealImportFunction key
        env:
          MEAL_IMPORT_FUNCTION_KEY: ${{ secrets.MEAL_IMPORT_FUNCTION_KEY }}
        run: |
          if [ -z "$MEAL_IMPORT_FUNCTION_KEY" ]; then
            echo "::error::The MEAL_IMPORT_FUNCTION_KEY secret is not set; meal imports would fail with 401."
            exit 1
          fi
          settings=MealWiz/MauiWASM/wwwroot/appsettings.Production.json
          jq --arg key "$MEAL_IMPORT_FUNCTION_KEY" '.MealImportFunction.key = $key' "$settings" > "$settings.tmp"
          mv "$settings.tmp" "$settings"

      - name: Rollback to previous deployment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_HILL_0F87A3A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/MealWiz/MauiWASM"
          api_location: ""
          output_location: "wwwroot"
